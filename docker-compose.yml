# FIX: prod config
services:
  db:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=ajour
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=postgresql://dbuser:secret@db:5432/ajour
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - API_URL="http://api:8080"
    depends_on:
      - api

volumes:
  pgdata:
