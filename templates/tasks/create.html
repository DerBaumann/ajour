{% extends "base.html" %}

{% block title %}Aufgabe erstellen{% endblock %}

{% block content %}

<section class="section">
  <div class="container" style="max-width: 700px;">

    <div class="level">
      <div class="level-left">
        <h1 class="title is-3">Neue Aufgabe</h1>
      </div>
      <div class="level-right">
        <a class="button is-light" href="/tasks">← Zurück</a>
      </div>
    </div>

    <div class="box">

      <form action="/tasks" method="post">

        <!-- Name -->
        <div class="field">
          <label class="label" for="name">Name</label>
          <div class="control">
            <input class="input" type="text" name="name" id="name" placeholder="Aufgabentitel" required />
          </div>
        </div>

        <!-- Description -->
        <div class="field">
          <label class="label" for="description">Beschreibung</label>
          <div class="control">
            <textarea
              class="textarea"
              name="description"
              id="description"
              placeholder="Optionale Beschreibung"
            ></textarea>
          </div>
        </div>

        <!-- Priority -->
        <div class="field">
          <label class="label">Priorität</label>

          <div class="buttons has-addons">
            <label class="button">
              <input type="radio" name="priority" value="low"> Niedrig
            </label>

            <label class="button">
              <input type="radio" name="priority" value="medium"> Mittel
            </label>

            <label class="button">
              <input type="radio" name="priority" value="high"> Hoch
            </label>

            <label class="button">
              <input type="radio" name="priority" value="very_high"> Sehr hoch
            </label>
          </div>
        </div>

        <div class="columns">
          <!-- Start -->
          <div class="column">
            <div class="field">
              <label class="label" for="start">Start</label>
              <div class="control">
                <input class="input" type="text" name="start" id="start" placeholder="Start date & time" />
              </div>
            </div>
          </div>

          <!-- Deadline -->
          <div class="column">
            <div class="field">
              <label class="label" for="deadline">Deadline</label>
              <div class="control">
                <input class="input" type="text" name="deadline" id="deadline" placeholder="Deadline" />
              </div>
            </div>
          </div>

        </div>

        <!-- Submit -->
        <div class="field is-grouped is-grouped-right">
          <p class="control">
            <button class="button is-primary" type="submit">
              Speichern
            </button>
          </p>
        </div>

      </form>

    </div>
  </div>
</section>

<script>
  flatpickr("#start", {
    enableTime: true,
    appendTo: document.body,
    defaultDate: new Date(),
    dateFormat: "Y-m-d H:i",
    time_24hr: true
  });

  flatpickr("#deadline", {
    enableTime: true,
    appendTo: document.body,
    dateFormat: "Y-m-d H:i",
    time_24hr: true,
    minDate: "today"
  });
</script>

{% endblock %}
