<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Document{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
  /*
      body {
        padding: 2rem;
        max-width: 900px;
        margin: auto;
      }
  */

      .task-card {
        padding: 1rem;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        margin-bottom: 0.75rem;
      }

      .task-meta {
        font-size: 0.85rem;
        color: #666;
      }

      .priority-high { color: #d33; }
      .priority-medium { color: #e6a100; }
      .priority-low { color: #2a8f2a; }

      .toolbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block content %}
    <p>Placeholder content</p>
    {% endblock %}
  </body>
</html>
