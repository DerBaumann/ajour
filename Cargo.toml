[package]
name = "order_manager_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["macros", "derive", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["full"] }
